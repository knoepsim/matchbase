# PR gates for dev and main (docs/CONTRIBUTING.md). All jobs run on GitHub-hosted runners (free for public repos).
name: Scan
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# a new push to a PR replaces its running checks; runs on dev and main always finish
concurrency:
  group: scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
          
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          
      - name: Generate Coverage
        working-directory: ./apps/web
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile --ignore-scripts
          npm run test:coverage

      - name: Install Playwright Browsers
        working-directory: ./apps/web
        run: pnpm run test:e2e:install

      - name: Run Playwright tests
        working-directory: ./apps/web
        run: pnpm run test:e2e

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: beerpong
          POSTGRES_PASSWORD: beerpong_ci
          POSTGRES_DB: beerpong
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beerpong"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://beerpong:beerpong_ci@localhost:5432/beerpong
      # Scratch database for the concurrency tests that need real row locks (tables are dropped)
      TEST_POSTGRES_URL: postgresql+asyncpg://beerpong:beerpong_ci@localhost:5432/beerpong_test
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Create the scratch database
        run: PGPASSWORD=beerpong_ci psql -h localhost -U beerpong -d beerpong -c "CREATE DATABASE beerpong_test"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run migrations on an empty database
        run: uv run alembic upgrade head

      - name: Run API tests
        run: uv run pytest -v

  # builds both images and blocks the PR if they contain a high or critical vulnerability that has a fix. One job
  # (not a matrix), because the branch protection requires a check with exactly this name.
  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # reads the cache docker-publish.yml writes on dev and main (a PR may read its base branch's cache)
      - name: Build Web Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./apps/web
          load: true
          tags: matchbase-web:check
          cache-from: type=gha,scope=web-amd64

      - name: Build API Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./apps/api
          load: true
          tags: matchbase-api:check
          cache-from: type=gha,scope=api-amd64

      - name: Scan the Web image for fixable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2 # the action ships v0.70.0
          image-ref: matchbase-web:check
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan the API image for fixable vulnerabilities
        if: success() || failure() # report both images even if the first has findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2 # the action ships v0.70.0
          image-ref: matchbase-api:check
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  # the same images for arm64 (Raspberry Pi as an edge), so a package without an arm64 build fails before the merge
  docker-build-check-arm64:
    name: Docker Build Check (arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./apps/${{ matrix.app }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}-arm64
