# One MatchBase Cloud instance: database, API, web app and the single entry point (deploy/README.md).
# The same file runs any number of instances side by side (e.g. prod and dev); each gets its own env file, which sets
# INSTANCE (project name, volumes, address in the tunnel network) and MATCHBASE_TAG (latest, dev, 0.2, ...):
#   docker compose --env-file deploy/cloud/prod.env -f deploy/cloud/docker-compose.yml -f deploy/cloud/tunnel.yml up -d
# How it is reached is an override: tunnel.yml (cloudflared from deploy/host) or expose.yml (ports 80/443 on the host).
name: ${INSTANCE:-matchbase}

x-auto-update: &auto-update
  # Watchtower (deploy/host) only updates containers with this label
  com.centurylinklabs.watchtower.enable: "true"

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: matchbase
      POSTGRES_USER: matchbase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in the env file}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchbase"]
      interval: 5s
      retries: 10

  api:
    image: ghcr.io/knoepsim/matchbase-api:${MATCHBASE_TAG:-latest}
    restart: always
    labels: *auto-update
    depends_on:
      db:
        condition: service_healthy # the image migrates the schema on start
    # No published port: only the proxy below reaches the API
    environment:
      DATABASE_URL: postgresql+asyncpg://matchbase:${POSTGRES_PASSWORD}@db:5432/matchbase
      SECRET_KEY: ${SECRET_KEY:?set it in the env file}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SMS_BACKEND: ${SMS_BACKEND:-dummy}
      SUPER_ADMIN_PHONES: ${SUPER_ADMIN_PHONES:-}
      # The browser always reaches the cloud over HTTPS (tunnel or Caddy), so session cookies are Secure
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Only the proxy can reach the API, so it may pass on the client address and scheme (X-Forwarded-*)
      FORWARDED_ALLOW_IPS: "*"

  web:
    image: ghcr.io/knoepsim/matchbase-web:${MATCHBASE_TAG:-latest}
    restart: always
    labels: *auto-update
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # Server-side requests go straight to the API over the internal network
      API_INTERNAL_URL: http://api:8000

  # The single entry point (deploy/caddy/Caddyfile): /api to the API, everything else to the web app
  caddy:
    image: caddy:2
    restart: always
    depends_on:
      - web
      - api
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
