# MatchBase Edge at the venue (docs/edge/README.md): the same API and web app as in the cloud, plus the MQTT
# broker of the table controllers and a local database. Start with: docker compose -f deploy/edge/docker-compose.yml up -d
services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: matchbase
      POSTGRES_USER: matchbase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in deploy/edge/.env}
    volumes:
      - core_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchbase"]
      interval: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2
    restart: always
    ports:
      - "1883:1883" # the table controllers reach the broker from the venue network
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - core_mqtt:/mosquitto/data

  api:
    image: ghcr.io/knoepsim/beerpong-webapp-api:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    environment:
      NODE_ROLE: edge
      NODE_NAME: ${NODE_NAME:-Tournament Core}
      MQTT_URL: mqtt://mqtt:1883
      DATABASE_URL: postgresql+asyncpg://matchbase:${POSTGRES_PASSWORD}@db:5432/matchbase
      SECRET_KEY: ${SECRET_KEY:?set it in deploy/edge/.env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      FORWARDED_ALLOW_IPS: "*" # only the proxy can reach the API

  web:
    image: ghcr.io/knoepsim/beerpong-webapp-web:latest
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8000

  # The single entry point at the venue, same Caddyfile as in the cloud: /api to the API, everything else to the web
  # app. SITE_ADDRESS=:80 serves plain HTTP in the venue network; a domain gives HTTPS (see deploy/README.md).
  caddy:
    image: caddy:2
    restart: always
    depends_on:
      - web
      - api
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - core_caddy_data:/data # certificates, survive restarts so Let's Encrypt is not asked again
      - core_caddy_config:/config

volumes:
  core_db:
  core_mqtt:
  core_caddy_data:
  core_caddy_config:
