# Broker of the Tournament Core: the table controllers publish on tables/{device}/state (docs/edge/protocol.md).
listener 1883
# Phase 1: open inside the venue network (the PoE switch of the tables). Before a real event: one user per
# controller (password_file) and an acl_file that lets each one write only tables/{its id}/#.
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
