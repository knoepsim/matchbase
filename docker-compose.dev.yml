services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: beerpong
      POSTGRES_USER: beerpong
      POSTGRES_PASSWORD: beerpong_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # broker of the table controllers, for trying out the Tournament Core (docs/edge): API with MQTT_URL=mqtt://localhost:1883
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./edge/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # Optional, to try the production entry point against the dev servers (pnpm dev, uvicorn on the host):
  # docker compose -f docker-compose.dev.yml --profile proxy up -d caddy, then open http://localhost:8080
  caddy:
    image: caddy:2
    profiles: [proxy]
    environment:
      API_UPSTREAM: host.docker.internal:8000
      WEB_UPSTREAM: host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux; Docker Desktop knows the name anyway
    ports:
      - "8080:80"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  postgres_data:
